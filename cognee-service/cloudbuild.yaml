# Cloud Build configuration for Cognee service
# Deploys self-hosted Cognee to Google Cloud Run

steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/cognee-service:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/cognee-service:latest"
      - "."
    dir: "cognee-service"

  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/cognee-service:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/cognee-service:latest"

  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "cognee-service"
      - "--image"
      - "gcr.io/$PROJECT_ID/cognee-service:$COMMIT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--no-allow-unauthenticated"
      - "--port"
      - "8000"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "2"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "5"
      - "--timeout"
      - "300"
      - "--set-env-vars"
      - "ENVIRONMENT=production,LOG_LEVEL=INFO"
      - "--set-secrets"
      - "LLM_API_KEY=openai-api-key:latest,DATABASE_URL=neon-database-url:latest"

images:
  - "gcr.io/$PROJECT_ID/cognee-service:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/cognee-service:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

