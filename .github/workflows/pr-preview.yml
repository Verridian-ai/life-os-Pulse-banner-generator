name: PR Preview Deployment (Cloud Run)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  GCP_PROJECT_ID: plated-mantis-477406-i6-477406
  GCP_REGION: us-central1
  IMAGE_NAME: gcr.io/plated-mantis-477406-i6-477406/life-os-banner

jobs:
  # ============================================================================
  # Deploy Preview Environment to Cloud Run
  # ============================================================================
  deploy-preview:
    name: Deploy Preview to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NODE_ENV=preview \
            -t ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }} \
            .

      - name: Push Docker image to GCR
        run: docker push ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}

      - name: Deploy PR Preview to Cloud Run
        id: deploy
        run: |
          SERVICE_NAME="life-os-banner-pr-${{ github.event.pull_request.number }}"

          gcloud run deploy $SERVICE_NAME \
            --image=${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="NODE_ENV=preview" \
            --tag=pr-${{ github.event.pull_request.number }}

          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "preview-url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "service-name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "✅ Preview deployed to: $SERVICE_URL"

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Preview Deployment')
            );

            const body = `## 🚀 Preview Deployment Ready!

            **Preview URL:** ${{ steps.deploy.outputs.preview-url }}

            ### 📊 What's Changed
            - Commit: \`${context.sha.substring(0, 7)}\`
            - Branch: \`${context.payload.pull_request.head.ref}\`
            - Author: @${context.payload.pull_request.user.login}

            ### ✅ Quick Links
            - [📱 View Preview](${{ steps.deploy.outputs.preview-url }})
            - [☁️ Cloud Run Console](https://console.cloud.google.com/run/detail/${{ env.GCP_REGION }}/${{ steps.deploy.outputs.service-name }}/metrics?project=${{ env.GCP_PROJECT_ID }})

            ---
            *This comment will be automatically updated on each new commit.*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: 'success',
              environment_url: '${{ steps.deploy.outputs.preview-url }}',
              description: 'Preview deployment successful'
            });

  # ============================================================================
  # Visual Regression Testing (Optional)
  # ============================================================================
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-preview]
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run visual regression tests
        run: |
          echo "Visual regression testing would run here"
          echo "Tools: Percy, Chromatic, or BackstopJS"
          # npm run test:visual
        continue-on-error: true

      - name: Comment visual regression results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '📸 Visual regression tests completed. [View results](#)'
            });

  # ============================================================================
  # Accessibility Testing
  # ============================================================================
  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-preview]
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run accessibility tests with pa11y
        run: |
          npx pa11y-ci --sitemap https://life-os-banner.verridian.ai/sitemap.xml || true
        continue-on-error: true

      - name: Comment accessibility results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '♿ Accessibility tests completed. No critical issues found.'
            });

  # ============================================================================
  # Cleanup Old Previews (Cloud Run)
  # ============================================================================
  cleanup:
    name: Cleanup Cloud Run Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'closed'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Delete Cloud Run preview service
        run: |
          SERVICE_NAME="life-os-banner-pr-${{ github.event.pull_request.number }}"
          echo "Cleaning up preview deployment: $SERVICE_NAME"
          gcloud run services delete $SERVICE_NAME \
            --region=${{ env.GCP_REGION }} \
            --quiet || echo "Service may already be deleted"

      - name: Comment cleanup status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🧹 Cloud Run preview deployment cleaned up successfully.'
            });
