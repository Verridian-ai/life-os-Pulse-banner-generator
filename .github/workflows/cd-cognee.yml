name: Deploy Cognee Service (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'cognee-service/**'
      - '.github/workflows/cd-cognee.yml'
  workflow_dispatch:

concurrency:
  group: cognee-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  GCP_PROJECT_ID: plated-mantis-477406-i6-477406
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: cognee-service
  IMAGE_NAME: gcr.io/plated-mantis-477406-i6-477406/cognee-service

jobs:
  deploy-cognee:
    name: Deploy Cognee to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.cognee-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./cognee-service

      - name: Push Docker image to GCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --port=8000 \
            --memory=2Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=5 \
            --timeout=300 \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO" \
            --set-secrets="LLM_API_KEY=OPENAI_API_KEY:latest,COGNEE_API_KEY=COGNEE_API_KEY:latest"

          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "cognee-url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "✅ Cognee deployed to: $SERVICE_URL"

      - name: Verify Cognee Health
        run: |
          # Get service URL
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          
          # Get identity token for authenticated request
          TOKEN=$(gcloud auth print-identity-token)
          
          # Health check
          curl -sf -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/health" || echo "Health check skipped (service may still be starting)"

