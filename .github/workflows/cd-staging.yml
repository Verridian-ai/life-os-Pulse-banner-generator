name: Deploy to Staging (Cloud Run)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  GCP_PROJECT_ID: plated-mantis-477406-i6-477406
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: life-os-banner-staging
  IMAGE_NAME: gcr.io/plated-mantis-477406-i6-477406/life-os-banner

jobs:
  deploy-staging:
    name: Deploy to Cloud Run Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.staging-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NODE_ENV=staging \
            -t ${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
            .

      - name: Push Docker image to GCR
        run: docker push ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}

      - name: Deploy to Cloud Run Staging
        id: deploy
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image=${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5 \
            --set-env-vars="NODE_ENV=staging"

          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "staging-url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $SERVICE_URL"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging deployment..."
          curl -f ${{ steps.deploy.outputs.staging-url }} || exit 0
        env:
          TEST_URL: ${{ steps.deploy.outputs.staging-url }}

      - name: Comment deployment URL on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 **Staging Deployment Successful!**\n\n📱 Staging URL: ${{ steps.deploy.outputs.staging-url }}\n\n✅ All checks passed`
            })

      - name: Notify deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `❌ **Staging Deployment Failed**\n\nPlease check the workflow logs for details.`
            })
