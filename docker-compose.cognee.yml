version: '3.8'

# LOCAL DEVELOPMENT ONLY - Cognee Memory for Claude Code Agents
# This runs on your Windows PC via Docker Desktop
# NOT for production deployment - only for local agent memory

services:
  cognee:
    image: cognee/cognee:latest
    container_name: local-cognee-memory
    ports:
      - "8000:8000"  # Local access only
    environment:
      - ENV=local
      - LLM_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-5.2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - POSTGRES_URI=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cognee
      - DATA_ROOT_DIRECTORY=/data
      - SYSTEM_ROOT_DIRECTORY=/system
      - LOG_LEVEL=info
      - TRANSPORT_MODE=http
    volumes:
      - cognee-data:/data
      - cognee-system:/system
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=cognee"

  neo4j:
    image: neo4j:5.15
    container_name: local-cognee-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_default__listen__address=0.0.0.0
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=neo4j"

  postgres:
    image: postgres:16-alpine
    container_name: local-cognee-postgres
    ports:
      - "5433:5432"  # Avoid conflict with Neon connection (if using local)
    environment:
      - POSTGRES_DB=cognee
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cognee"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres"

volumes:
  cognee-data:
    driver: local
    name: local_cognee_memory_data
  cognee-system:
    driver: local
    name: local_cognee_memory_system
  neo4j-data:
    driver: local
    name: local_cognee_neo4j_data
  neo4j-logs:
    driver: local
    name: local_cognee_neo4j_logs
  postgres-data:
    driver: local
    name: local_cognee_postgres_data

networks:
  default:
    name: local-cognee-memory-network
