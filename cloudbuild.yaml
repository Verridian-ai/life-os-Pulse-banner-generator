steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/nanobanna-pro:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/nanobanna-pro:latest"
      - "."

  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/nanobanna-pro:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/nanobanna-pro:latest"

  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "nanobanna-pro"
      - "--image"
      - "gcr.io/$PROJECT_ID/nanobanna-pro:$COMMIT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "2"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "20"
      - "--timeout"
      - "300"
      - "--set-env-vars"
      - "NODE_ENV=production,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},CORS_ORIGIN=${_CORS_ORIGIN},COGNEE_API_URL=${_COGNEE_API_URL},WORKOS_REDIRECT_URI=${_WORKOS_REDIRECT_URI},WORKOS_ORG_ID=${_WORKOS_ORG_ID}"
      - "--set-secrets"
      - "DATABASE_URL=NEON_DATABASE_URL:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,COGNEE_API_KEY=COGNEE_API_KEY:latest,WORKOS_API_KEY=WORKOS_API_KEY:latest,WORKOS_CLIENT_ID=WORKOS_CLIENT_ID:latest,WORKOS_COOKIE_PASSWORD=WORKOS_COOKIE_PASSWORD:latest"

images:
  - "gcr.io/$PROJECT_ID/nanobanna-pro:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/nanobanna-pro:latest"

substitutions:
  _GCS_BUCKET_NAME: "signal-user-files"
  _CORS_ORIGIN: "https://life-os-verridian.ai,https://life-os-banner.verridian.ai,https://nanobanna.verridian.ai"
  _COGNEE_API_URL: "https://cognee-api-ypjes2hexa-uc.a.run.app"
  _WORKOS_REDIRECT_URI: "https://life-os-verridian.ai/api/auth/callback"
  _WORKOS_ORG_ID: "org_01KETHAB24WTQT83FRYBETZGPW"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
