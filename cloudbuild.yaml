steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/nanobanna-pro:latest"
      - "."

  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/nanobanna-pro:latest"

  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "nanobanna-pro"
      - "--image"
      - "gcr.io/$PROJECT_ID/nanobanna-pro:latest"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"
      - "--update-env-vars"
      - "GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},NODE_ENV=production,OPENROUTER_API_KEY=${_OPENROUTER_API_KEY},OPENAI_API_KEY=${_OPENAI_API_KEY},REPLICATE_API_KEY=${_REPLICATE_API_KEY}"

images:
  - "gcr.io/$PROJECT_ID/nanobanna-pro:latest"

substitutions:
  _GCS_BUCKET_NAME: "life-os-user-files"
  _OPENROUTER_API_KEY: ""
  _OPENAI_API_KEY: ""
  _REPLICATE_API_KEY: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
